<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three.js SHADER SUMMON 🔥</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #000;
      color: #e0e0e0;
      overflow: hidden;
    }

    #info {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 100;
      background: rgba(0,0,0,0.7);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #7dd3fc;
      max-width: 300px;
    }

    h1 {
      font-size: 20px;
      color: #7dd3fc;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .control {
      margin: 15px 0;
    }

    label {
      display: block;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    input[type="range"] {
      width: 100%;
      height: 4px;
      background: #333;
      outline: none;
      border-radius: 2px;
      -webkit-appearance: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: #7dd3fc;
      cursor: pointer;
      border-radius: 50%;
    }

    .value {
      display: inline-block;
      color: #7dd3fc;
      font-family: monospace;
      font-size: 12px;
      margin-left: 8px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: 2px solid #7dd3fc;
      border-radius: 8px;
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 15px;
      transition: all 0.3s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(125, 211, 252, 0.5);
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
    }

    .preset-btn {
      padding: 8px;
      margin: 5px 0;
      background: #222;
      border: 1px solid #444;
      color: #e0e0e0;
      font-size: 11px;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .preset-btn:hover {
      background: #333;
      border-color: #7dd3fc;
    }
  </style>
</head>
<body>
  <div id="info">
    <h1>🔥 Shader Summon</h1>
    <p style="font-size: 11px; color: #888; margin-bottom: 15px;">Full shader magic unleashed</p>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 15px;">
      <button class="preset-btn" onclick="loadPreset('minimal')">Minimal</button>
      <button class="preset-btn" onclick="loadPreset('intense')">Intense</button>
      <button class="preset-btn" onclick="loadPreset('psychedelic')">Psychedelic</button>
      <button class="preset-btn" onclick="loadPreset('divine')">Divine</button>
    </div>

    <div class="control">
      <label>Bloom Intensity <span class="value" id="bloom-val">2.5</span></label>
      <input type="range" id="bloom" min="0" max="5" value="2.5" step="0.1">
    </div>

    <div class="control">
      <label>Wisp Energy <span class="value" id="wisp-val">1.0</span></label>
      <input type="range" id="wisp-energy" min="0" max="2" value="1.0" step="0.1">
    </div>

    <div class="control">
      <label>Particle Count <span class="value" id="particles-val">60</span></label>
      <input type="range" id="particles" min="20" max="200" value="60" step="10">
    </div>

    <div class="control">
      <label>Glyph Complexity <span class="value" id="complexity-val">3</span></label>
      <input type="range" id="complexity" min="1" max="5" value="3" step="1">
    </div>

    <div class="control">
      <label>Chromatic Aberration <span class="value" id="chroma-val">0.002</span></label>
      <input type="range" id="chroma" min="0" max="0.01" value="0.002" step="0.001">
    </div>

    <div class="control">
      <label>Distortion <span class="value" id="distort-val">0.05</span></label>
      <input type="range" id="distort" min="0" max="0.2" value="0.05" step="0.01">
    </div>

    <button onclick="triggerSummon()">⚡ SUMMON ⚡</button>
  </div>

  <div id="canvas-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

    // State
    const state = {
      bloom: 2.5,
      wispEnergy: 1.0,
      particles: 60,
      complexity: 3,
      chroma: 0.002,
      distortion: 0.05,
      isAnimating: false
    };

    // Scene setup
    let scene, camera, renderer, composer;
    let wisp, particles = [], glyphRings = [];
    let time = 0;

    const container = document.getElementById('canvas-container');
    const width = window.innerWidth;
    const height = window.innerHeight;

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050510);
    scene.fog = new THREE.Fog(0x050510, 200, 800);

    camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 2000);
    camera.position.z = 400;

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    // ==================== SHADERS ====================

    // HOLOGRAPHIC WISP SHADER
    const wispVertexShader = `
      varying vec2 vUv;
      varying vec3 vNormal;
      varying vec3 vPosition;
      uniform float time;
      uniform float energy;

      // Noise function
      vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
      vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
      vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
      vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

      float snoise(vec3 v) {
        const vec2 C = vec2(1.0/6.0, 1.0/3.0);
        const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
        vec3 i  = floor(v + dot(v, C.yyy));
        vec3 x0 = v - i + dot(i, C.xxx);
        vec3 g = step(x0.yzx, x0.xyz);
        vec3 l = 1.0 - g;
        vec3 i1 = min(g.xyz, l.zxy);
        vec3 i2 = max(g.xyz, l.zxy);
        vec3 x1 = x0 - i1 + C.xxx;
        vec3 x2 = x0 - i2 + C.yyy;
        vec3 x3 = x0 - D.yyy;
        i = mod289(i);
        vec4 p = permute(permute(permute(
          i.z + vec4(0.0, i1.z, i2.z, 1.0))
          + i.y + vec4(0.0, i1.y, i2.y, 1.0))
          + i.x + vec4(0.0, i1.x, i2.x, 1.0));
        float n_ = 0.142857142857;
        vec3 ns = n_ * D.wyz - D.xzx;
        vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
        vec4 x_ = floor(j * ns.z);
        vec4 y_ = floor(j - 7.0 * x_);
        vec4 x = x_ *ns.x + ns.yyyy;
        vec4 y = y_ *ns.x + ns.yyyy;
        vec4 h = 1.0 - abs(x) - abs(y);
        vec4 b0 = vec4(x.xy, y.xy);
        vec4 b1 = vec4(x.zw, y.zw);
        vec4 s0 = floor(b0)*2.0 + 1.0;
        vec4 s1 = floor(b1)*2.0 + 1.0;
        vec4 sh = -step(h, vec4(0.0));
        vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
        vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
        vec3 p0 = vec3(a0.xy, h.x);
        vec3 p1 = vec3(a0.zw, h.y);
        vec3 p2 = vec3(a1.xy, h.z);
        vec3 p3 = vec3(a1.zw, h.w);
        vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
        p0 *= norm.x;
        p1 *= norm.y;
        p2 *= norm.z;
        p3 *= norm.w;
        vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
        m = m * m;
        return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
      }

      void main() {
        vUv = uv;
        vNormal = normalize(normalMatrix * normal);

        vec3 pos = position;
        float noise = snoise(pos * 0.5 + time * 0.5) * energy;
        pos += normal * noise * 0.3;

        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
        vPosition = mvPosition.xyz;
        gl_Position = projectionMatrix * mvPosition;
      }
    `;

    const wispFragmentShader = `
      uniform float time;
      uniform float energy;
      uniform vec3 color1;
      uniform vec3 color2;
      uniform vec3 color3;
      varying vec2 vUv;
      varying vec3 vNormal;
      varying vec3 vPosition;

      void main() {
        vec3 viewDirection = normalize(cameraPosition - vPosition);
        float fresnel = pow(1.0 - dot(viewDirection, vNormal), 3.0);

        float pulse = sin(time * 2.0) * 0.5 + 0.5;
        float pulse2 = sin(time * 3.0 + 1.0) * 0.5 + 0.5;

        vec3 color = mix(color1, color2, fresnel);
        color = mix(color, color3, pulse);

        float alpha = fresnel * (0.6 + pulse * 0.4) * energy;

        // Holographic shimmer
        float shimmer = sin(vUv.y * 20.0 + time * 5.0) * 0.1 + 0.9;
        color *= shimmer;

        gl_FragColor = vec4(color, alpha);
      }
    `;

    // PARTICLE SHADER
    const particleVertexShader = `
      attribute float size;
      attribute vec3 customColor;
      varying vec3 vColor;
      uniform float time;

      void main() {
        vColor = customColor;
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = size * (300.0 / -mvPosition.z);
        gl_Position = projectionMatrix * mvPosition;
      }
    `;

    const particleFragmentShader = `
      uniform sampler2D pointTexture;
      varying vec3 vColor;

      void main() {
        vec2 center = gl_PointCoord - vec2(0.5);
        float dist = length(center);
        float alpha = 1.0 - smoothstep(0.0, 0.5, dist);

        vec3 color = vColor;
        float glow = exp(-dist * 4.0);
        color += glow * 0.5;

        gl_FragColor = vec4(color, alpha);
      }
    `;

    // POST-PROCESSING SHADERS
    const ChromaticAberrationShader = {
      uniforms: {
        'tDiffuse': { value: null },
        'amount': { value: 0.002 },
        'time': { value: 0 }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float amount;
        uniform float time;
        varying vec2 vUv;

        void main() {
          vec2 offset = amount * vec2(cos(time), sin(time));
          vec4 cr = texture2D(tDiffuse, vUv + offset);
          vec4 cg = texture2D(tDiffuse, vUv);
          vec4 cb = texture2D(tDiffuse, vUv - offset);
          gl_FragColor = vec4(cr.r, cg.g, cb.b, cg.a);
        }
      `
    };

    const DistortionShader = {
      uniforms: {
        'tDiffuse': { value: null },
        'amount': { value: 0.05 },
        'time': { value: 0 }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float amount;
        uniform float time;
        varying vec2 vUv;

        void main() {
          vec2 center = vUv - 0.5;
          float dist = length(center);
          float distortion = sin(dist * 10.0 - time * 2.0) * amount;
          vec2 distortedUv = vUv + normalize(center) * distortion;
          gl_FragColor = texture2D(tDiffuse, distortedUv);
        }
      `
    };

    // ==================== CREATE OBJECTS ====================

    function createWisp() {
      const geometry = new THREE.IcosahedronGeometry(40, 4);
      const material = new THREE.ShaderMaterial({
        vertexShader: wispVertexShader,
        fragmentShader: wispFragmentShader,
        uniforms: {
          time: { value: 0 },
          energy: { value: state.wispEnergy },
          color1: { value: new THREE.Color(0x7dd3fc) },
          color2: { value: new THREE.Color(0xffffff) },
          color3: { value: new THREE.Color(0xa78bfa) }
        },
        transparent: true,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide
      });

      wisp = new THREE.Mesh(geometry, material);
      wisp.visible = false;
      scene.add(wisp);
    }

    function createParticles() {
      particles.forEach(p => scene.remove(p));
      particles = [];

      const geometry = new THREE.BufferGeometry();
      const positions = [];
      const colors = [];
      const sizes = [];

      for (let i = 0; i < state.particles; i++) {
        const angle = (i / state.particles) * Math.PI * 2;
        const radius = 180;
        positions.push(
          Math.cos(angle) * radius,
          Math.sin(angle) * radius,
          0
        );

        const color = new THREE.Color();
        color.setHSL(0.55 + Math.random() * 0.1, 1.0, 0.6);
        colors.push(color.r, color.g, color.b);

        sizes.push(8 + Math.random() * 8);
      }

      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('customColor', new THREE.Float32BufferAttribute(colors, 3));
      geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));

      const material = new THREE.ShaderMaterial({
        vertexShader: particleVertexShader,
        fragmentShader: particleFragmentShader,
        uniforms: {
          time: { value: 0 }
        },
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const particleSystem = new THREE.Points(geometry, material);
      particleSystem.userData.basePositions = positions;
      scene.add(particleSystem);
      particles.push(particleSystem);
    }

    function createGlyphRings() {
      glyphRings.forEach(r => scene.remove(r));
      glyphRings = [];

      for (let i = 0; i < state.complexity; i++) {
        const radius = 150 + i * 50;
        const geometry = new THREE.TorusGeometry(radius, 2, 16, 100);
        const material = new THREE.MeshBasicMaterial({
          color: 0x4fb3d4,
          transparent: true,
          opacity: 0,
          blending: THREE.AdditiveBlending
        });
        const ring = new THREE.Mesh(geometry, material);
        ring.rotation.x = Math.PI / 2;
        scene.add(ring);
        glyphRings.push(ring);
      }
    }

    // ==================== POST-PROCESSING ====================

    composer = new EffectComposer(renderer);
    const renderPass = new RenderPass(scene, camera);
    composer.addPass(renderPass);

    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(width, height),
      state.bloom,
      0.4,
      0.85
    );
    composer.addPass(bloomPass);

    const chromaPass = new ShaderPass(ChromaticAberrationShader);
    chromaPass.uniforms['amount'].value = state.chroma;
    composer.addPass(chromaPass);

    const distortPass = new ShaderPass(DistortionShader);
    distortPass.uniforms['amount'].value = state.distortion;
    composer.addPass(distortPass);

    // ==================== INIT ====================

    createWisp();
    createParticles();
    createGlyphRings();

    // ==================== CONTROLS ====================

    document.getElementById('bloom').addEventListener('input', (e) => {
      state.bloom = parseFloat(e.target.value);
      bloomPass.strength = state.bloom;
      document.getElementById('bloom-val').textContent = state.bloom.toFixed(1);
    });

    document.getElementById('wisp-energy').addEventListener('input', (e) => {
      state.wispEnergy = parseFloat(e.target.value);
      if (wisp) wisp.material.uniforms.energy.value = state.wispEnergy;
      document.getElementById('wisp-val').textContent = state.wispEnergy.toFixed(1);
    });

    document.getElementById('particles').addEventListener('input', (e) => {
      state.particles = parseInt(e.target.value);
      createParticles();
      document.getElementById('particles-val').textContent = state.particles;
    });

    document.getElementById('complexity').addEventListener('input', (e) => {
      state.complexity = parseInt(e.target.value);
      createGlyphRings();
      document.getElementById('complexity-val').textContent = state.complexity;
    });

    document.getElementById('chroma').addEventListener('input', (e) => {
      state.chroma = parseFloat(e.target.value);
      chromaPass.uniforms['amount'].value = state.chroma;
      document.getElementById('chroma-val').textContent = state.chroma.toFixed(3);
    });

    document.getElementById('distort').addEventListener('input', (e) => {
      state.distortion = parseFloat(e.target.value);
      distortPass.uniforms['amount'].value = state.distortion;
      document.getElementById('distort-val').textContent = state.distortion.toFixed(2);
    });

    // ==================== PRESETS ====================

    window.loadPreset = function(preset) {
      const presets = {
        minimal: {
          bloom: 1.0,
          wispEnergy: 0.5,
          particles: 30,
          complexity: 2,
          chroma: 0.001,
          distortion: 0.02
        },
        intense: {
          bloom: 3.5,
          wispEnergy: 1.5,
          particles: 100,
          complexity: 4,
          chroma: 0.004,
          distortion: 0.08
        },
        psychedelic: {
          bloom: 4.5,
          wispEnergy: 2.0,
          particles: 150,
          complexity: 5,
          chroma: 0.008,
          distortion: 0.15
        },
        divine: {
          bloom: 3.0,
          wispEnergy: 1.2,
          particles: 80,
          complexity: 4,
          chroma: 0.003,
          distortion: 0.05
        }
      };

      const p = presets[preset];
      Object.assign(state, p);

      document.getElementById('bloom').value = p.bloom;
      document.getElementById('wisp-energy').value = p.wispEnergy;
      document.getElementById('particles').value = p.particles;
      document.getElementById('complexity').value = p.complexity;
      document.getElementById('chroma').value = p.chroma;
      document.getElementById('distort').value = p.distortion;

      document.getElementById('bloom-val').textContent = p.bloom.toFixed(1);
      document.getElementById('wisp-val').textContent = p.wispEnergy.toFixed(1);
      document.getElementById('particles-val').textContent = p.particles;
      document.getElementById('complexity-val').textContent = p.complexity;
      document.getElementById('chroma-val').textContent = p.chroma.toFixed(3);
      document.getElementById('distort-val').textContent = p.distortion.toFixed(2);

      bloomPass.strength = p.bloom;
      if (wisp) wisp.material.uniforms.energy.value = p.wispEnergy;
      chromaPass.uniforms['amount'].value = p.chroma;
      distortPass.uniforms['amount'].value = p.distortion;

      createParticles();
      createGlyphRings();
    };

    // ==================== ANIMATION ====================

    window.triggerSummon = async function() {
      if (state.isAnimating) return;
      state.isAnimating = true;

      // Reset
      wisp.visible = false;
      wisp.scale.set(0.1, 0.1, 0.1);
      glyphRings.forEach(r => r.material.opacity = 0);

      // 1. Glyph rings appear (0-800ms)
      await animate({
        duration: 800,
        onUpdate: (progress) => {
          glyphRings.forEach((ring, i) => {
            ring.material.opacity = progress * 0.6;
            ring.rotation.z = progress * Math.PI * 2 * (i % 2 ? 1 : -1);
          });
        }
      });

      // 2. Wisp appears and pulses (800-2000ms)
      wisp.visible = true;
      await animate({
        duration: 1200,
        onUpdate: (progress) => {
          const scale = 0.1 + progress * 0.9;
          wisp.scale.set(scale, scale, scale);
          wisp.material.uniforms.energy.value = progress * state.wispEnergy * 1.5;
        }
      });

      // 3. Particles orbit (1000-3000ms)
      const orbitPromise = animate({
        duration: 2000,
        onUpdate: (progress) => {
          particles.forEach(p => {
            const positions = p.geometry.attributes.position.array;
            const basePos = p.userData.basePositions;
            for (let i = 0; i < positions.length; i += 3) {
              const angle = (i / positions.length) * Math.PI * 2 + progress * Math.PI * 4;
              const radius = 180 + Math.sin(progress * Math.PI * 2) * 30;
              positions[i] = Math.cos(angle) * radius;
              positions[i + 1] = Math.sin(angle) * radius;
            }
            p.geometry.attributes.position.needsUpdate = true;
          });
        }
      });

      await orbitPromise;

      // 4. MASSIVE FLASH (3000-3500ms)
      const flash = document.createElement('div');
      flash.style.cssText = `
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(125,211,252,0.8) 30%, transparent 70%);
        pointer-events: none;
        z-index: 1000;
      `;
      document.body.appendChild(flash);

      await animate({
        duration: 500,
        onUpdate: (progress) => {
          if (progress < 0.3) {
            flash.style.opacity = progress / 0.3;
          } else {
            flash.style.opacity = 1 - (progress - 0.3) / 0.7;
          }

          // Wisp explodes
          const explodeScale = 1 + (1 - Math.abs(progress - 0.5) * 2) * 3;
          wisp.scale.set(explodeScale, explodeScale, explodeScale);

          // Screen shake
          camera.position.x = (Math.random() - 0.5) * 20 * (1 - progress);
          camera.position.y = (Math.random() - 0.5) * 20 * (1 - progress);
        }
      });

      flash.remove();

      // 5. Fade out (3500-4500ms)
      await animate({
        duration: 1000,
        onUpdate: (progress) => {
          const fadeOut = 1 - progress;
          wisp.material.uniforms.energy.value = fadeOut * state.wispEnergy;
          glyphRings.forEach(r => r.material.opacity = fadeOut * 0.6);
          camera.position.x = 0;
          camera.position.y = 0;
        }
      });

      wisp.visible = false;
      state.isAnimating = false;
    };

    function animate(options) {
      return new Promise(resolve => {
        const start = Date.now();
        const { duration, onUpdate } = options;

        function step() {
          const elapsed = Date.now() - start;
          const progress = Math.min(elapsed / duration, 1);
          onUpdate(progress);

          if (progress < 1) {
            requestAnimationFrame(step);
          } else {
            resolve();
          }
        }
        step();
      });
    }

    // ==================== RENDER LOOP ====================

    function render() {
      requestAnimationFrame(render);
      time += 0.016;

      // Update shader uniforms
      if (wisp && wisp.visible) {
        wisp.material.uniforms.time.value = time;
        wisp.rotation.y = time * 0.5;
        wisp.rotation.x = Math.sin(time * 0.3) * 0.2;
      }

      particles.forEach(p => {
        if (p.material.uniforms) {
          p.material.uniforms.time.value = time;
        }
      });

      glyphRings.forEach((ring, i) => {
        ring.rotation.z += 0.001 * (i % 2 ? 1 : -1);
      });

      chromaPass.uniforms['time'].value = time;
      distortPass.uniforms['time'].value = time;

      composer.render();
    }

    render();

    // Resize handler
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      composer.setSize(w, h);
    });
  </script>
</body>
</html>
