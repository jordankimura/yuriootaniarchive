<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Animation Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #050510; min-height: 100vh; overflow: hidden; }

    @keyframes spin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }
    @keyframes spin-reverse {
      from { transform: translate(-50%, -50%) rotate(360deg); }
      to { transform: translate(-50%, -50%) rotate(0deg); }
    }
    @keyframes glow-pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.8; }
    }

    .center-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(107,168,194,0.4) 50%, transparent 70%);
      transform: translate(-50%, -50%);
      animation: glow-pulse 2s ease-in-out infinite;
      z-index: 5;
    }

    .ring {
      position: absolute;
      top: 50%;
      left: 50%;
      border-radius: 50%;
      z-index: 3;
    }

    .ring-1 {
      width: 100px;
      height: 100px;
      border: 2px solid rgba(107, 168, 194, 0.6);
      box-shadow: 0 0 10px rgba(107, 168, 194, 0.3);
      animation: spin 8s linear infinite;
    }

    .ring-2 {
      width: 150px;
      height: 150px;
      border: 1px solid rgba(201, 169, 97, 0.5);
      box-shadow: 0 0 10px rgba(201, 169, 97, 0.3);
      animation: spin-reverse 10s linear infinite;
    }

    .ring-3 {
      width: 200px;
      height: 200px;
      border: 1px solid rgba(107, 168, 194, 0.4);
      box-shadow: 0 0 8px rgba(107, 168, 194, 0.2);
      animation: spin 12s linear infinite;
    }
  </style>
</head>
<body>
  <div class="center-glow"></div>
  <div class="ring ring-1"></div>
  <div class="ring ring-2"></div>
  <div class="ring ring-3"></div>
</body>
</html>
